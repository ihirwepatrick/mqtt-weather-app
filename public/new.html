<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Station</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mqtt/4.3.7/mqtt.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/axios/1.1.3/axios.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap');
        
        :root {
            --primary-color: #6C5CE7;
            --secondary-color: #00CEC9;
            --accent-color: #FAB1A0;
            --bg-dark: #1E293B;
            --bg-light: #334155;
            --card-bg: rgba(255, 255, 255, 0.05);
            --text-primary: #FFFFFF;
            --text-secondary: rgba(255, 255, 255, 0.7);
            --temp-color: #FF7E5F;
            --humidity-color: #00F2FE;
            --success-color: #00FF7F;
            --error-color: #FF3030;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Poppins', sans-serif;
            background: var(--bg-dark);
            background-image: linear-gradient(45deg, rgba(108, 92, 231, 0.1), rgba(0, 206, 201, 0.1));
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
        }
        
        .dashboard {
            max-width: 1200px;
            margin: 30px auto;
            padding: 15px;
        }
        
        .title-section {
            text-align: center;
            margin-bottom: 40px;
        }
        
        .title-section h1 {
            font-size: 2.2rem;
            font-weight: 600;
            color: var(--secondary-color);
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        
        .title-section p {
            font-size: 1rem;
            color: var(--text-secondary);
            margin-top: 10px;
        }
        
        .main-container {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
        }
        
        .glass-panel {
            background: var(--card-bg);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
        }
        
        .metrics-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
        }
        
        .metric-card {
            background: var(--card-bg);
            border-radius: 15px;
            padding: 25px;
            position: relative;
            transition: all 0.3s ease;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .metric-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 25px rgba(0, 0, 0, 0.2);
        }
        
        .metric-card.temperature {
            background: linear-gradient(135deg, rgba(255, 126, 95, 0.1), rgba(255, 107, 107, 0.1));
            border: 1px solid rgba(255, 126, 95, 0.2);
        }
        
        .metric-card.humidity {
            background: linear-gradient(135deg, rgba(0, 242, 254, 0.1), rgba(72, 219, 251, 0.1));
            border: 1px solid rgba(0, 242, 254, 0.2);
        }
        
        .metric-icon {
            position: absolute;
            top: 20px;
            right: 20px;
            font-size: 1.8rem;
            color: var(--text-secondary);
        }
        
        .metric-label {
            font-size: 1.1rem;
            font-weight: 300;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .metric-value {
            font-size: 3rem;
            font-weight: 600;
            margin: 15px 0;
            color: var(--text-primary);
        }
        
        .metric-unit {
            font-size: 1.3rem;
            vertical-align: super;
            margin-left: 5px;
            color: var(--text-secondary);
        }
        
        .metric-average {
            color: var(--text-secondary);
            font-size: 0.9rem;
            margin-top: 10px;
        }
        
        .chart-section {
            padding: 20px 0;
        }
        
        .chart-container {
            height: 380px;
            width: 100%;
            position: relative;
        }
        
        .section-title {
            font-size: 1.4rem;
            font-weight: 600;
            color: var(--secondary-color);
            margin-bottom: 20px;
        }
        
        .status-section {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 15px;
            padding: 0 5px;
        }
        
        .status-item {
            display: flex;
            align-items: center;
            font-size: 0.85rem;
            color: var(--text-secondary);
        }
        
        .status-icon {
            margin-right: 6px;
            font-size: 0.9rem;
        }
        
        .status-value {
            font-weight: 400;
            color: var(--text-primary);
            margin-left: 4px;
        }
        
        .pulse {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--success-color);
            margin-right: 8px;
            animation: pulse 1.8s infinite;
        }
        
        .pulse.error {
            background: var(--error-color);
        }
        
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(0, 255, 127, 0.7); }
            70% { box-shadow: 0 0 0 8px rgba(0, 255, 127, 0); }
            100% { box-shadow: 0 0 0 0 rgba(0, 255, 127, 0); }
        }

        .live-indicator {
            display: inline-flex;
            align-items: center;
            color: var(--secondary-color);
            font-size: 0.75rem;
            position: absolute;
            top: 15px;
            right: 15px;
        }

        .live-dot {
            width: 6px;
            height: 6px;
            background-color: var(--secondary-color);
            border-radius: 50%;
            margin-right: 4px;
            animation: blink 1.2s ease-in-out infinite;
        }

        @keyframes blink {
            0% { opacity: 1; }
            50% { opacity: 0.3; }
            100% { opacity: 1; }
        }
        
        /* Chart Legend */
        .chart-legend {
            display: flex;
            justify-content: center;
            margin-bottom: 15px;
        }
        
        .legend-item {
            display: flex;
            align-items: center;
            margin: 0 15px;
        }
        
        .legend-color {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            margin-right: 8px;
        }
        
        .legend-color.temperature {
            background-color: var(--temp-color);
        }
        
        .legend-color.humidity {
            background-color: var(--humidity-color);
        }
        
        .legend-label {
            font-size: 0.9rem;
            color: var(--text-secondary);
        }
        
        /* Tooltip */
        .chart-tooltip {
            position: absolute;
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 10px;
            border-radius: 5px;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.2s;
            z-index: 10;
            font-size: 0.85rem;
            max-width: 200px;
        }
        
        .tooltip-title {
            font-weight: 600;
            margin-bottom: 5px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
            padding-bottom: 3px;
        }
        
        .tooltip-value {
            display: flex;
            align-items: center;
            margin-top: 3px;
        }
        
        .tooltip-color {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            margin-right: 5px;
        }
        
        @media (max-width: 768px) {
            .dashboard {
                margin: 15px;
                padding: 10px;
            }
            
            .metric-value {
                font-size: 2.5rem;
            }
            
            .chart-container {
                height: 280px;
            }
            
            .title-section h1 {
                font-size: 1.8rem;
            }
            
            .status-section {
                flex-direction: column;
                align-items: flex-start;
            }
            
            .status-item:last-child {
                margin-top: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="dashboard">
        <div class="title-section">
            <h1>ATMOSPHERIC MONITOR</h1>
            <p>Real-time MQTT Weather Station Dashboard</p>
        </div>
        
        <div class="main-container">
            <div class="glass-panel">
                <div class="chart-section">
                    <h2 class="section-title">Environmental Trends</h2>
                    <div class="chart-legend">
                        <div class="legend-item">
                            <div class="legend-color temperature"></div>
                            <div class="legend-label">Temperature (°C)</div>
                        </div>
                        <div class="legend-item">
                            <div class="legend-color humidity"></div>
                            <div class="legend-label">Humidity (%)</div>
                        </div>
                    </div>
                    <div class="chart-container">
                        <canvas id="weatherChart"></canvas>
                        <div id="chartTooltip" class="chart-tooltip"></div>
                    </div>
                    
                    <div class="status-section">
                        <div class="status-item">
                            <div id="db-pulse" class="pulse"></div>
                            <i class="fas fa-database status-icon"></i>
                            Database: <span id="db-status" class="status-value">Waiting for data...</span>
                        </div>
                        <div class="status-item">
                            <i class="fas fa-sync-alt status-icon"></i>
                            Last update: <span id="last-update" class="status-value">--</span>
                        </div>
                    </div>
                </div>
            </div>
            
            <div class="metrics-container">
                <div class="metric-card temperature">
                    <i class="fas fa-temperature-high metric-icon"></i>
                    <div class="metric-label">Temperature</div>
                    <div class="metric-value"><span id="temp">--</span><span class="metric-unit">°C</span></div>
                    <div class="metric-average">
                        <i class="fas fa-clock"></i> 5min avg: <span id="avg-temp">--</span>°C
                    </div>
                    <div class="live-indicator">
                        <div class="live-dot"></div> LIVE
                    </div>
                </div>
                
                <div class="metric-card humidity">
                    <i class="fas fa-tint metric-icon"></i>
                    <div class="metric-label">Humidity</div>
                    <div class="metric-value"><span id="humidity">--</span><span class="metric-unit">%</span></div>
                    <div class="metric-average">
                        <i class="fas fa-clock"></i> 5min avg: <span id="avg-humidity">--</span>%
                    </div>
                    <div class="live-indicator">
                        <div class="live-dot"></div> LIVE
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        // Custom Chart Implementation
        class WeatherChart {
            constructor(canvasId) {
                this.canvas = document.getElementById(canvasId);
                this.ctx = this.canvas.getContext('2d');
                this.tooltip = document.getElementById('chartTooltip');
                this.data = {
                    labels: [],
                    temperatures: [],
                    humidities: []
                };
                
                // Chart settings
                this.settings = {
                    padding: { top: 40, right: 60, bottom: 60, left: 60 },
                    tempColor: getComputedStyle(document.documentElement).getPropertyValue('--temp-color').trim(),
                    humidityColor: getComputedStyle(document.documentElement).getPropertyValue('--humidity-color').trim(),
                    gridColor: 'rgba(255, 255, 255, 0.1)',
                    textColor: 'rgba(255, 255, 255, 0.7)',
                    tempMin: 0,
                    tempMax: 50,
                    humidityMin: 0,
                    humidityMax: 100,
                    animationDuration: 1000
                };
                
                // Set up canvas
                this.resizeCanvas();
                window.addEventListener('resize', () => this.resizeCanvas());
                
                // Set up tooltip
                this.setupTooltip();
            }
            
            resizeCanvas() {
                // Get the device pixel ratio
                const dpr = window.devicePixelRatio || 1;
                
                // Get the container dimensions
                const rect = this.canvas.parentNode.getBoundingClientRect();
                
                // Set canvas dimensions
                this.canvas.width = rect.width * dpr;
                this.canvas.height = rect.height * dpr;
                this.canvas.style.width = `${rect.width}px`;
                this.canvas.style.height = `${rect.height}px`;
                
                // Scale the context
                this.ctx.scale(dpr, dpr);
                
                // Store dimensions
                this.width = rect.width;
                this.height = rect.height;
                
                // Redraw if we have data
                if (this.data.labels.length > 0) {
                    this.draw();
                }
            }
            
            setupTooltip() {
                this.canvas.addEventListener('mousemove', (e) => {
                    const rect = this.canvas.getBoundingClientRect();
                    const x = e.clientX - rect.left;
                    const y = e.clientY - rect.top;
                    
                    // Only show tooltip if we have data
                    if (this.data.labels.length === 0) return;
                    
                    // Calculate chart area
                    const chartWidth = this.width - this.settings.padding.left - this.settings.padding.right;
                    const chartHeight = this.height - this.settings.padding.top - this.settings.padding.bottom;
                    
                    // Check if mouse is in chart area
                    if (
                        x >= this.settings.padding.left && 
                        x <= this.width - this.settings.padding.right &&
                        y >= this.settings.padding.top && 
                        y <= this.height - this.settings.padding.bottom
                    ) {
                        // Find closest data point
                        const dataWidth = chartWidth / (this.data.labels.length - 1);
                        const index = Math.round((x - this.settings.padding.left) / dataWidth);
                        
                        if (index >= 0 && index < this.data.labels.length) {
                            // Position tooltip
                            const tooltipX = this.settings.padding.left + index * dataWidth;
                            
                            // Get data values
                            const temperature = this.data.temperatures[index];
                            const humidity = this.data.humidities[index];
                            const label = this.data.labels[index];
                            
                            // Update tooltip content
                            this.tooltip.innerHTML = `
                                <div class="tooltip-title">${label}</div>
                                <div class="tooltip-value">
                                    <div class="tooltip-color" style="background-color: ${this.settings.tempColor}"></div>
                                    Temperature: ${temperature !== null ? temperature.toFixed(1) + '°C' : 'N/A'}
                                </div>
                                <div class="tooltip-value">
                                    <div class="tooltip-color" style="background-color: ${this.settings.humidityColor}"></div>
                                    Humidity: ${humidity !== null ? humidity.toFixed(1) + '%' : 'N/A'}
                                </div>
                            `;
                            
                            // Position tooltip
                            const tooltipWidth = this.tooltip.offsetWidth;
                            const tooltipHeight = this.tooltip.offsetHeight;
                            
                            let tooltipLeft = tooltipX + rect.left - tooltipWidth / 2;
                            let tooltipTop = y + rect.top - tooltipHeight - 10;
                            
                            // Keep tooltip within window bounds
                            if (tooltipLeft < 0) tooltipLeft = 0;
                            if (tooltipLeft + tooltipWidth > window.innerWidth) {
                                tooltipLeft = window.innerWidth - tooltipWidth;
                            }
                            
                            if (tooltipTop < 0) {
                                tooltipTop = y + rect.top + 20;
                            }
                            
                            this.tooltip.style.left = `${tooltipLeft}px`;
                            this.tooltip.style.top = `${tooltipTop}px`;
                            this.tooltip.style.opacity = '1';
                            
                            // Highlight the data point
                            this.draw();
                            
                            // Draw highlight circles
                            const tempY = this.scaleTempY(temperature);
                            const humidityY = this.scaleHumidityY(humidity);
                            
                            this.ctx.lineWidth = 3;
                            
                            // Temperature highlight
                            this.ctx.strokeStyle = this.settings.tempColor;
                            this.ctx.fillStyle = 'rgba(255, 255, 255, 0.9)';
                            this.ctx.beginPath();
                            this.ctx.arc(tooltipX, tempY, 6, 0, Math.PI * 2);
                            this.ctx.fill();
                            this.ctx.stroke();
                            
                            // Humidity highlight
                            this.ctx.strokeStyle = this.settings.humidityColor;
                            this.ctx.fillStyle = 'rgba(255, 255, 255, 0.9)';
                            this.ctx.beginPath();
                            this.ctx.arc(tooltipX, humidityY, 6, 0, Math.PI * 2);
                            this.ctx.fill();
                            this.ctx.stroke();
                        }
                    } else {
                        // Hide tooltip when outside chart area
                        this.tooltip.style.opacity = '0';
                        this.draw(); // Redraw without highlights
                    }
                });
                
                this.canvas.addEventListener('mouseleave', () => {
                    this.tooltip.style.opacity = '0';
                    this.draw(); // Redraw without highlights
                });
            }
            
            updateData(labels, temperatures, humidities) {
                // Store previous data for animation
                this.prevData = {
                    temperatures: [...this.data.temperatures],
                    humidities: [...this.data.humidities]
                };
                
                // Update data
                this.data.labels = labels;
                this.data.temperatures = temperatures;
                this.data.humidities = humidities;
                
                // Start animation
                this.animateChart();
            }
            
            animateChart() {
                const startTime = performance.now();
                const animate = (currentTime) => {
                    const elapsed = currentTime - startTime;
                    const progress = Math.min(elapsed / this.settings.animationDuration, 1);
                    
                    // Create interpolated data
                    const interpolatedTemps = [];
                    const interpolatedHumidities = [];
                    
                    for (let i = 0; i < this.data.temperatures.length; i++) {
                        const prevTemp = this.prevData.temperatures[i] || 0;
                        const prevHumidity = this.prevData.humidities[i] || 0;
                        
                        const targetTemp = this.data.temperatures[i];
                        const targetHumidity = this.data.humidities[i];
                        
                        interpolatedTemps[i] = prevTemp + (targetTemp - prevTemp) * progress;
                        interpolatedHumidities[i] = prevHumidity + (targetHumidity - prevHumidity) * progress;
                    }
                    
                    // Draw with interpolated data
                    this.draw(interpolatedTemps, interpolatedHumidities);
                    
                    // Continue animation if not complete
                    if (progress < 1) {
                        requestAnimationFrame(animate);
                    }
                };
                
                requestAnimationFrame(animate);
            }
            
            scaleX(index) {
                const chartWidth = this.width - this.settings.padding.left - this.settings.padding.right;
                return this.settings.padding.left + (index / (this.data.labels.length - 1)) * chartWidth;
            }
            
            scaleTempY(temp) {
                const chartHeight = this.height - this.settings.padding.top - this.settings.padding.bottom;
                return this.settings.padding.top + chartHeight - ((temp - this.settings.tempMin) / (this.settings.tempMax - this.settings.tempMin)) * chartHeight;
            }
            
            scaleHumidityY(humidity) {
                const chartHeight = this.height - this.settings.padding.top - this.settings.padding.bottom;
                return this.settings.padding.top + chartHeight - ((humidity - this.settings.humidityMin) / (this.settings.humidityMax - this.settings.humidityMin)) * chartHeight;
            }
            
            draw(temperatures, humidities) {
                // Use provided data or the stored data
                const tempData = temperatures || this.data.temperatures;
                const humidityData = humidities || this.data.humidities;
                
                // Clear canvas
                this.ctx.clearRect(0, 0, this.width, this.height);
                
                // Chart dimensions
                const chartWidth = this.width - this.settings.padding.left - this.settings.padding.right;
                const chartHeight = this.height - this.settings.padding.top - this.settings.padding.bottom;
                
                // No data case
                if (this.data.labels.length === 0) {
                    this.ctx.fillStyle = this.settings.textColor;
                    this.ctx.font = "16px 'Poppins', sans-serif";
                    this.ctx.textAlign = "center";
                    this.ctx.fillText("Waiting for data...", this.width / 2, this.height / 2);
                    return;
                }
                
                // Draw axes
                this.ctx.strokeStyle = 'rgba(255, 255, 255, 0.2)';
                this.ctx.lineWidth = 1;
                
                // X-axis
                this.ctx.beginPath();
                this.ctx.moveTo(this.settings.padding.left, this.settings.padding.top + chartHeight);
                this.ctx.lineTo(this.settings.padding.left + chartWidth, this.settings.padding.top + chartHeight);
                this.ctx.stroke();
                
                // Y-axis (left - temperature)
                this.ctx.beginPath();
                this.ctx.moveTo(this.settings.padding.left, this.settings.padding.top);
                this.ctx.lineTo(this.settings.padding.left, this.settings.padding.top + chartHeight);
                this.ctx.stroke();
                
                // Y-axis (right - humidity)
                this.ctx.beginPath();
                this.ctx.moveTo(this.settings.padding.left + chartWidth, this.settings.padding.top);
                this.ctx.lineTo(this.settings.padding.left + chartWidth, this.settings.padding.top + chartHeight);
                this.ctx.stroke();
                
                // Draw grid lines
                this.ctx.strokeStyle = this.settings.gridColor;
                
                // Horizontal grid lines
                for (let i = 0; i <= 5; i++) {
                    const y = this.settings.padding.top + (i / 5) * chartHeight;
                    this.ctx.beginPath();
                    this.ctx.moveTo(this.settings.padding.left, y);
                    this.ctx.lineTo(this.settings.padding.left + chartWidth, y);
                    this.ctx.stroke();
                    
                    // Temperature labels (left)
                    const tempValue = this.settings.tempMax - (i / 5) * (this.settings.tempMax - this.settings.tempMin);
                    this.ctx.fillStyle = this.settings.textColor;
                    this.ctx.font = "12px 'Poppins', sans-serif";
                    this.ctx.textAlign = "right";
                    this.ctx.fillText(tempValue.toFixed(0), this.settings.padding.left - 10, y + 4);
                    
                    // Humidity labels (right)
                    const humidityValue = this.settings.humidityMax - (i / 5) * (this.settings.humidityMax - this.settings.humidityMin);
                    this.ctx.textAlign = "left";
                    this.ctx.fillText(humidityValue.toFixed(0), this.settings.padding.left + chartWidth + 10, y + 4);
                }
                
                // X-axis labels
                this.ctx.textAlign = "center";
                this.ctx.fillStyle = this.settings.textColor;
                
                // Only show a subset of labels to avoid overcrowding
                const labelStep = Math.max(1, Math.floor(this.data.labels.length / 6));
                
                for (let i = 0; i < this.data.labels.length; i += labelStep) {
                    const x = this.scaleX(i);
                    this.ctx.fillText(this.data.labels[i], x, this.settings.padding.top + chartHeight + 20);
                    
                    // Vertical grid line
                    this.ctx.beginPath();
                    this.ctx.moveTo(x, this.settings.padding.top);
                    this.ctx.lineTo(x, this.settings.padding.top + chartHeight);
                    this.ctx.stroke();
                }
                
                // Axis titles
                this.ctx.font = "14px 'Poppins', sans-serif";
                this.ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
                
                // X-axis title
                this.ctx.textAlign = "center";
                this.ctx.fillText("Time", this.settings.padding.left + chartWidth / 2, this.height - 15);
                
                // Y-axis titles
                this.ctx.save();
                this.ctx.translate(15, this.settings.padding.top + chartHeight / 2);
                this.ctx.rotate(-Math.PI / 2);
                this.ctx.textAlign = "center";
                this.ctx.fillStyle = this.settings.tempColor;
                this.ctx.fillText("Temperature (°C)", 0, 0);
                this.ctx.restore();
                
                this.ctx.save();
                this.ctx.translate(this.width - 15, this.settings.padding.top + chartHeight / 2);
                this.ctx.rotate(Math.PI / 2);
                this.ctx.textAlign = "center";
                this.ctx.fillStyle = this.settings.humidityColor;
                this.ctx.fillText("Humidity (%)", 0, 0);
                this.ctx.restore();
                
                // Draw temperature area
                this.ctx.fillStyle = `${this.settings.tempColor}20`;
                this.ctx.beginPath();
                
                for (let i = 0; i < tempData.length; i++) {
                    const x = this.scaleX(i);
                    const y = this.scaleTempY(tempData[i]);
                    
                    if (i === 0) {
                        this.ctx.moveTo(x, y);
                    } else {
                        this.ctx.lineTo(x, y);
                    }
                }
                
                this.ctx.lineTo(this.scaleX(tempData.length - 1), this.settings.padding.top + chartHeight);
                this.ctx.lineTo(this.scaleX(0), this.settings.padding.top + chartHeight);
                this.ctx.closePath();
                this.ctx.fill();
                
                // Draw humidity area
                this.ctx.fillStyle = `${this.settings.humidityColor}20`;
                this.ctx.beginPath();
                
                for (let i = 0; i < humidityData.length; i++) {
                    const x = this.scaleX(i);
                    const y = this.scaleHumidityY(humidityData[i]);
                    
                    if (i === 0) {
                        this.ctx.moveTo(x, y);
                    } else {
                        this.ctx.lineTo(x, y);
                    }
                }
                
                this.ctx.lineTo(this.scaleX(humidityData.length - 1), this.settings.padding.top + chartHeight);
                this.ctx.lineTo(this.scaleX(0), this.settings.padding.top + chartHeight);
                this.ctx.closePath();
                this.ctx.fill();
                
                // Draw temperature line
                this.ctx.strokeStyle = this.settings.tempColor;
                this.ctx.lineWidth = 3;
                this.ctx.beginPath();
                
                for (let i = 0; i < tempData.length; i++) {
                    const x = this.scaleX(i);
                    const y = this.scaleTempY(tempData[i]);
                    
                    if (i === 0) {
                        this.ctx.moveTo(x, y);
                    } else {
                        this.ctx.lineTo(x, y);
                    }
                }
                
                this.ctx.stroke();
                
                // Draw humidity line
                this.ctx.strokeStyle = this.settings.humidityColor;
                this.ctx.lineWidth = 3;
                this.ctx.beginPath();
                
                for (let i = 0; i < humidityData.length; i++) {
                    const x = this.scaleX(i);
                    const y = this.scaleHumidityY(humidityData[i]);
                    
                    if (i === 0) {
                        this.ctx.moveTo(x, y);
                    } else {
                        this.ctx.lineTo(x, y);
                    }
                }
                
                this.ctx.stroke();
                
                // Draw data points
                for (let i = 0; i < tempData.length; i++) {
                    const x = this.scaleX(i);
                    const y = this.scaleTempY(tempData[i]);
                    
                    // Temperature point
                    this.ctx.fillStyle = this.settings.tempColor;
                    this.ctx.beginPath();
                    this.ctx.arc(x, y, 4, 0, Math.PI * 2);
                    this.ctx.fill();
                    
                    this.ctx.strokeStyle = 'rgba(255, 255, 255, 0.8)';
                    this.ctx.lineWidth = 2;
                    this.ctx.beginPath();
                    this.ctx.arc(x, y, 4, 0, Math.PI * 2);
                    this.ctx.stroke();
                }
                
                for (let i = 0; i < humidityData.length; i++) {
                    const x = this.scaleX(i);
                    const y = this.scaleHumidityY(humidityData[i]);
                    
                    // Humidity point
                    this.ctx.fillStyle = this.settings.humidityColor;
                    this.ctx.beginPath();
                    this.ctx.arc(x, y, 4, 0, Math.PI * 2);
                    this.ctx.fill();
                    
                    this.ctx.strokeStyle = 'rgba(255, 255, 255, 0.8)';
                    this.ctx.lineWidth = 2;
                    this.ctx.beginPath();
                    this.ctx.arc(x, y, 4, 0, Math.PI * 2);
                    this.ctx.stroke();
                }
            }
        }
        
        // Initialize the custom chart
        const weatherChart = new WeatherChart('weatherChart');
        
        // Check for most recent data immediately
        function fetchCurrentReadings() {
            axios.get('/api/weather/current')
                .then(response => {
                    const data = response.data;
                    if (data) {
                        if (data.temperature !== undefined) {
                            document.getElementById("temp").innerText = data.temperature.toFixed(1);
                        }
                        if (data.humidity !== undefined) {
                            document.getElementById("humidity").innerText = data.humidity.toFixed(1);
                        }
                    }
                })
                .catch(error => {
                    console.error('Error fetching current readings:', error);
                });
        }

        // Function to update the chart with 5-minute interval data
        function updateChartWithHistoricalData() {
            axios.get('/api/weather/history')
                .then(response => {
                    const data = response.data;
                    
                    if (data.length > 0) {
                        document.getElementById("db-status").textContent = "Connected, storing data";
                        document.getElementById("db-status").style.color = "var(--success-color)";
                        document.getElementById("db-pulse").classList.remove("error");
                    }
                    
                    // Prepare data for the chart
                    const labels = [];
                    const temperatures = [];
                    const humidities = [];
                    
                    // Add historical data points
                    data.forEach(point => {
                        const timestamp = new Date(point.timestamp).toLocaleTimeString();
                        labels.push(timestamp);
                        temperatures.push(point.avg_temperature);
                        humidities.push(point.avg_humidity);
                    });
                    
                    // Update the chart
                    weatherChart.updateData(labels, temperatures, humidities);
                    
                    // Update average displays
                    if (data.length > 0) {
                        const latest = data[data.length - 1];
                        document.getElementById("avg-temp").innerText = latest.avg_temperature !== null ? latest.avg_temperature.toFixed(1) : "--";
                        document.getElementById("avg-humidity").innerText = latest.avg_humidity !== null ? latest.avg_humidity.toFixed(1) : "--";
                        document.getElementById("last-update").innerText = new Date().toLocaleTimeString();
                    }
                })
                .catch(error => {
                    console.error('Error fetching historical data:', error);
                    document.getElementById("db-status").textContent = "Error connecting to database";
                    document.getElementById("db-status").style.color = "var(--error-color)";
                    document.getElementById("db-pulse").classList.add("error");
                });
        }

        // Connect to the MQTT Broker over WebSockets
        const mqttClient = mqtt.connect('ws://157.173.101.159:9001');

        mqttClient.on('connect', () => {
            console.log("Connected to MQTT via WebSockets");
            mqttClient.subscribe("/work_group_01/room_temp/temperature");
            mqttClient.subscribe("/work_group_01/room_temp/humidity");
        });

        mqttClient.on('message', (topic, message) => {
            console.log(`Received: ${topic} → ${message.toString()}`);
            const value = parseFloat(message.toString());
            
            // Update the display with animation
            if (topic === "/work_group_01/room_temp/temperature") {
                const tempElement = document.getElementById("temp");
                animateValue(tempElement, parseFloat(tempElement.innerText) || 0, value, 1000);
                
                // Send to backend to store in SQLite
                axios.post('/api/weather/data', {
                    type: 'temperature',
                    value: value,
                    timestamp: new Date().toISOString()
                }).catch(error => console.error('Error storing temperature:', error));
                
            } else if (topic === "/work_group_01/room_temp/humidity") {
                const humidityElement = document.getElementById("humidity");
                animateValue(humidityElement, parseFloat(humidityElement.innerText) || 0, value, 1000);
                
                // Send to backend to store in SQLite
                axios.post('/api/weather/data', {
                    type: 'humidity',
                    value: value,
                    timestamp: new Date().toISOString()
                }).catch(error => console.error('Error storing humidity:', error));
            }
        });

        // Animate value change function
        function animateValue(element, start, end, duration) {
            if (isNaN(start)) start = 0;
            if (isNaN(end)) return;
            
            const range = end - start;
            let current = start;
            const increment = end > start ? 0.1 : -0.1;
            const stepTime = Math.abs(Math.floor(duration / (range / increment)));
            
            const timer = setInterval(function() {
                current += increment;
                element.innerText = current.toFixed(1);
                
                if ((increment > 0 && current >= end) || (increment < 0 && current <= end)) {
                    element.innerText = end.toFixed(1);
                    clearInterval(timer);
                }
            }, stepTime);
        }

        // Fetch current readings on load
        fetchCurrentReadings();

        // Update chart with historical data regularly
        updateChartWithHistoricalData(); // Initial load
        setInterval(updateChartWithHistoricalData, 30000); // Then every 30 seconds
    </script>
</body>
</html>
