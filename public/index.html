<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Station</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mqtt/4.3.7/mqtt.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/axios/1.1.3/axios.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap');
        
        :root {
            --primary-color: #4361ee;
            --secondary-color: #3a0ca3;
            --accent-color: #f72585;
            --success-color: #4cc9f0;
            --warning-color: #f8961e;
            --danger-color: #f94144;
            --bg-dark: #151a30;
            --bg-card: #1f2641;
            --text-primary: #ffffff;
            --text-secondary: rgba(255, 255, 255, 0.7);
            --border-radius: 16px;
            --card-shadow: 0 10px 20px rgba(0, 0, 0, 0.15);
            --transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Montserrat', sans-serif;
            background: var(--bg-dark);
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(67, 97, 238, 0.1) 0%, transparent 20%),
                radial-gradient(circle at 90% 80%, rgba(247, 37, 133, 0.1) 0%, transparent 20%),
                radial-gradient(circle at 50% 50%, rgba(76, 201, 240, 0.05) 0%, transparent 100%);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
            padding: 20px;
        }
        
        .dashboard {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px 0;
        }
        
        .title-section {
            text-align: center;
            margin-bottom: 40px;
            position: relative;
            padding-bottom: 20px;
        }
        
        .title-section:after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 80px;
            height: 4px;
            background: linear-gradient(90deg, var(--primary-color), var(--accent-color));
            border-radius: 2px;
        }
        
        .title-section h1 {
            font-size: 2.5rem;
            font-weight: 700;
            background: linear-gradient(90deg, var(--primary-color), var(--accent-color));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-bottom: 15px;
        }
        
        .title-section p {
            font-size: 1.1rem;
            color: var(--text-secondary);
            font-weight: 300;
        }
        
        .dashboard-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            grid-template-rows: auto auto;
            gap: 25px;
            grid-template-areas: 
                "temp humid pressure"
                "chart chart chart";
        }
        
        .metric-card {
            background: var(--bg-card);
            border-radius: var(--border-radius);
            padding: 30px;
            position: relative;
            transition: var(--transition);
            box-shadow: var(--card-shadow);
            overflow: hidden;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        
        .metric-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.25);
        }
        
        .metric-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 5px;
        }
        
        .metric-card.temperature {
            grid-area: temp;
        }
        
        .metric-card.temperature::before {
            background: linear-gradient(90deg, var(--accent-color), var(--danger-color));
        }
        
        .metric-card.humidity {
            grid-area: humid;
        }
        
        .metric-card.humidity::before {
            background: linear-gradient(90deg, var(--success-color), var(--primary-color));
        }
        
        .metric-card.pressure {
            grid-area: pressure;
        }
        
        .metric-card.pressure::before {
            background: linear-gradient(90deg, var(--warning-color), var(--secondary-color));
        }
        
        .metric-icon {
            position: absolute;
            top: 25px;
            right: 25px;
            font-size: 2.2rem;
            opacity: 0.8;
            color: var(--text-secondary);
        }
        
        .metric-label {
            font-size: 1.2rem;
            font-weight: 500;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 5px;
        }
        
        .metric-value {
            font-size: 3.5rem;
            font-weight: 700;
            margin: 20px 0;
            color: var(--text-primary);
            display: flex;
            align-items: baseline;
        }
        
        .metric-unit {
            font-size: 1.5rem;
            margin-left: 8px;
            color: var(--text-secondary);
            font-weight: 400;
        }
        
        .metric-stats {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .metric-average {
            color: var(--text-secondary);
            font-size: 0.95rem;
            display: flex;
            align-items: center;
        }
        
        .metric-average i {
            margin-right: 8px;
            color: var(--primary-color);
        }
        
        .chart-container {
            grid-area: chart;
            background: var(--bg-card);
            border-radius: var(--border-radius);
            padding: 30px;
            box-shadow: var(--card-shadow);
            position: relative;
        }
        
        .chart-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }
        
        .section-title {
            font-size: 1.5rem;
            font-weight: 600;
            color: var(--text-primary);
            position: relative;
            padding-left: 15px;
        }
        
        .section-title::before {
            content: '';
            position: absolute;
            left: 0;
            top: 50%;
            transform: translateY(-50%);
            width: 5px;
            height: 25px;
            background: linear-gradient(to bottom, var(--primary-color), var(--accent-color));
            border-radius: 3px;
        }
        
        .chart-wrapper {
            height: 400px;
            width: 100%;
            position: relative;
        }
        
        .status-section {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 25px;
            padding-top: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .status-item {
            display: flex;
            align-items: center;
            font-size: 0.9rem;
            color: var(--text-secondary);
            background: rgba(0, 0, 0, 0.2);
            padding: 8px 15px;
            border-radius: 30px;
        }
        
        .status-icon {
            margin-right: 8px;
            font-size: 1rem;
        }
        
        .status-value {
            font-weight: 500;
            color: var(--text-primary);
            margin-left: 5px;
        }
        
        .pulse {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--success-color);
            margin-right: 10px;
            animation: pulse 1.8s infinite;
        }
        
        .pulse.error {
            background: var(--danger-color);
        }
        
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(76, 201, 240, 0.7); }
            70% { box-shadow: 0 0 0 10px rgba(76, 201, 240, 0); }
            100% { box-shadow: 0 0 0 0 rgba(76, 201, 240, 0); }
        }

        .live-indicator {
            display: inline-flex;
            align-items: center;
            color: var(--success-color);
            font-size: 0.8rem;
            font-weight: 600;
            letter-spacing: 1px;
            background: rgba(76, 201, 240, 0.1);
            padding: 5px 12px;
            border-radius: 20px;
            border: 1px solid rgba(76, 201, 240, 0.3);
        }

        .live-dot {
            width: 8px;
            height: 8px;
            background-color: var(--success-color);
            border-radius: 50%;
            margin-right: 8px;
            animation: blink 1.2s ease-in-out infinite;
        }

        @keyframes blink {
            0% { opacity: 1; }
            50% { opacity: 0.3; }
            100% { opacity: 1; }
        }
        
        .time-range-selector {
            display: flex;
            gap: 10px;
        }
        
        .time-btn {
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: var(--text-secondary);
            padding: 8px 15px;
            border-radius: 20px;
            cursor: pointer;
            transition: var(--transition);
            font-size: 0.9rem;
            font-weight: 500;
        }
        
        .time-btn:hover, .time-btn.active {
            background: var(--primary-color);
            color: white;
        }
        
        @media (max-width: 1200px) {
            .dashboard-grid {
                grid-template-columns: 1fr 1fr;
                grid-template-areas: 
                    "temp humid"
                    "pressure pressure"
                    "chart chart";
            }
        }
        
        @media (max-width: 768px) {
            .dashboard-grid {
                grid-template-columns: 1fr;
                grid-template-areas: 
                    "temp"
                    "humid"
                    "pressure"
                    "chart";
            }
            
            .dashboard {
                padding: 10px;
            }
            
            .title-section h1 {
                font-size: 1.8rem;
            }
            
            .metric-value {
                font-size: 2.8rem;
            }
            
            .chart-wrapper {
                height: 300px;
            }
            
            .status-section {
                flex-direction: column;
                gap: 15px;
                align-items: flex-start;
            }
            
            .time-range-selector {
                margin-top: 15px;
                justify-content: center;
                flex-wrap: wrap;
            }
        }
    </style>
</head>
<body>
    <div class="dashboard">
        <div class="title-section">
            <h1>WEATHER STATION DASHBOARD</h1>
            <p>Real-time MQTT Weather Station Dashboard Using Sensor</p>
        </div>
        
        <div class="dashboard-grid">
            <div class="metric-card temperature">
                <i class="fas fa-temperature-high metric-icon"></i>
                <div>
                    <div class="metric-label">Temperature</div>
                    <div class="metric-value">
                        <span id="temp">--</span>
                        <span class="metric-unit">°C</span>
                    </div>
                </div>
                <div class="metric-stats">
                    <div class="metric-average">
                        <i class="fas fa-clock"></i> 5min avg: <span id="avg-temp">--</span>°C
                    </div>
                    <div class="live-indicator">
                        <div class="live-dot"></div> LIVE
                    </div>
                </div>
            </div>
            
            <div class="metric-card humidity">
                <i class="fas fa-tint metric-icon"></i>
                <div>
                    <div class="metric-label">Humidity</div>
                    <div class="metric-value">
                        <span id="humidity">--</span>
                        <span class="metric-unit">%</span>
                    </div>
                </div>
                <div class="metric-stats">
                    <div class="metric-average">
                        <i class="fas fa-clock"></i> 5min avg: <span id="avg-humidity">--</span>%
                    </div>
                    <div class="live-indicator">
                        <div class="live-dot"></div> LIVE
                    </div>
                </div>
            </div>
            
            <div class="metric-card pressure">
                <i class="fas fa-compress-alt metric-icon"></i>
                <div>
                    <div class="metric-label">Air Quality</div>
                    <div class="metric-value">
                        <span id="pressure">--</span>
                        <span class="metric-unit">AQI</span>
                    </div>
                </div>
                <div class="metric-stats">
                    <div class="metric-average">
                        <i class="fas fa-clock"></i> 5min avg: <span id="avg-pressure">--</span> AQI
                    </div>
                    <div class="live-indicator">
                        <div class="live-dot"></div> LIVE
                    </div>
                </div>
            </div>
            
            <div class="chart-container">
                <div class="chart-header">
                    <h2 class="section-title">Environmental Trends</h2>
                    <div class="time-range-selector">
                        <button class="time-btn active" data-range="1h">1h</button>
                        <button class="time-btn" data-range="6h">6h</button>
                        <button class="time-btn" data-range="24h">24h</button>
                    </div>
                </div>
                
                <div class="chart-wrapper">
                    <canvas id="weatherChart"></canvas>
                </div>
                
                <div class="status-section">
                    <div class="status-item">
                        <div id="db-pulse" class="pulse"></div>
                        <i class="fas fa-database status-icon"></i>
                        Database: <span id="db-status" class="status-value">Waiting for data...</span>
                    </div>
                    <div class="status-item">
                        <i class="fas fa-wifi status-icon"></i>
                        MQTT: <span id="mqtt-status" class="status-value">Connecting...</span>
                    </div>
                    <div class="status-item">
                        <i class="fas fa-sync-alt status-icon"></i>
                        Last update: <span id="last-update" class="status-value">--</span>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        // Initialize chart with custom styling
        const ctx = document.getElementById('weatherChart').getContext('2d');
        Chart.defaults.color = 'rgba(255, 255, 255, 0.7)';
        Chart.defaults.font.family = "'Montserrat', sans-serif";
        
        const weatherChart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: [],
                datasets: [
                    {
                        label: 'Temperature (°C)',
                        borderColor: '#f72585',
                        backgroundColor: 'rgba(247, 37, 133, 0.2)',
                        borderWidth: 3,
                        pointBackgroundColor: '#f72585',
                        pointBorderColor: 'rgba(255, 255, 255, 0.8)',
                        pointBorderWidth: 2,
                        pointRadius: 4,
                        pointHoverRadius: 6,
                        tension: 0.4,
                        data: [],
                        yAxisID: 'y'
                    },
                    {
                        label: 'Humidity (%)',
                        borderColor: '#4cc9f0',
                        backgroundColor: 'rgba(76, 201, 240, 0.2)',
                        borderWidth: 3,
                        pointBackgroundColor: '#4cc9f0',
                        pointBorderColor: 'rgba(255, 255, 255, 0.8)',
                        pointBorderWidth: 2,
                        pointRadius: 4,
                        pointHoverRadius: 6,
                        tension: 0.4,
                        data: [],
                        yAxisID: 'y1'
                    },
                    {
                        label: 'Air Quality (AQI)',
                        borderColor: '#f8961e',
                        backgroundColor: 'rgba(248, 150, 30, 0.2)',
                        borderWidth: 3,
                        pointBackgroundColor: '#f8961e',
                        pointBorderColor: 'rgba(255, 255, 255, 0.8)',
                        pointBorderWidth: 2,
                        pointRadius: 4,
                        pointHoverRadius: 6,
                        tension: 0.4,
                        data: [],
                        yAxisID: 'y2'
                    }
                ]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                interaction: {
                    mode: 'index',
                    intersect: false,
                },
                plugins: {
                    legend: {
                        position: 'top',
                        labels: {
                            padding: 20,
                            usePointStyle: true,
                            pointStyle: 'circle',
                            font: {
                                size: 12
                            }
                        }
                    },
                    tooltip: {
                        backgroundColor: 'rgba(31, 38, 65, 0.9)',
                        titleFont: {
                            size: 13
                        },
                        bodyFont: {
                            size: 13
                        },
                        padding: 12,
                        cornerRadius: 8,
                        displayColors: true,
                        borderColor: 'rgba(255, 255, 255, 0.1)',
                        borderWidth: 1
                    }
                },
                scales: {
                    x: {
                        grid: {
                            color: 'rgba(255, 255, 255, 0.05)',
                            borderColor: 'rgba(255, 255, 255, 0.1)'
                        },
                        ticks: {
                            font: {
                                size: 11
                            }
                        },
                        title: {
                            display: true,
                            text: 'Time',
                            font: {
                                size: 13
                            }
                        }
                    },
                    y: {
                        type: 'linear',
                        display: true,
                        position: 'left',
                        title: {
                            display: true,
                            text: 'Temperature (°C)',
                            font: {
                                size: 13
                            }
                        },
                        grid: {
                            color: 'rgba(255, 255, 255, 0.05)',
                            borderColor: 'rgba(255, 255, 255, 0.1)'
                        },
                        min: 0,
                        max: 50
                    },
                    y1: {
                        type: 'linear',
                        display: true,
                        position: 'right',
                        title: {
                            display: true,
                            text: 'Humidity (%)',
                            font: {
                                size: 13
                            }
                        },
                        min: 0,
                        max: 100,
                        grid: {
                            drawOnChartArea: false,
                            borderColor: 'rgba(255, 255, 255, 0.1)'
                        }
                    },
                    y2: {
                        type: 'linear',
                        display: false,
                        min: 0,
                        max: 500
                    }
                },
                animations: {
                    tension: {
                        duration: 1000,
                        easing: 'linear'
                    }
                }
            }
        });

        // Time range selector functionality
        document.querySelectorAll('.time-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.time-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                const range = btn.dataset.range;
                // Here you would fetch data for the selected time range
                updateChartWithHistoricalData(range);
            });
        });

        // Check for most recent data immediately
        function fetchCurrentReadings() {
            axios.get('/api/weather/current')
                .then(response => {
                    const data = response.data;
                    if (data) {
                        if (data.temperature !== undefined) {
                            document.getElementById("temp").innerText = data.temperature.toFixed(1);
                        }
                        if (data.humidity !== undefined) {
                            document.getElementById("humidity").innerText = data.humidity.toFixed(1);
                        }
                        // Simulate air quality data (you would replace this with real data)
                        document.getElementById("pressure").innerText = Math.floor(Math.random() * 100 + 50);
                    }
                })
                .catch(error => {
                    console.error('Error fetching current readings:', error);
                });
        }

        // Function to update the chart with historical data
        function updateChartWithHistoricalData(timeRange = '1h') {
            axios.get('/api/weather/history')
                .then(response => {
                    const data = response.data;
                    
                    if (data.length > 0) {
                        document.getElementById("db-status").textContent = "Connected, storing data";
                        document.getElementById("db-status").style.color = "#4cc9f0";
                        document.getElementById("db-pulse").classList.remove("error");
                    }
                    
                    // Clear existing data
                    weatherChart.data.labels = [];
                    weatherChart.data.datasets[0].data = [];
                    weatherChart.data.datasets[1].data = [];
                    weatherChart.data.datasets[2].data = []; // Air quality data
                    
                    // Add historical data points
                    data.forEach(point => {
                        const timestamp = new Date(point.timestamp).toLocaleTimeString();
                        weatherChart.data.labels.push(timestamp);
                        weatherChart.data.datasets[0].data.push(point.avg_temperature);
                        weatherChart.data.datasets[1].data.push(point.avg_humidity);
                        // Simulate air quality data (you would replace this with real data)
                        weatherChart.data.datasets[2].data.push(Math.floor(Math.random() * 100 + 50));
                    });
                    
                    // Update average displays
                    if (data.length > 0) {
                        const latest = data[data.length - 1];
                        document.getElementById("avg-temp").innerText = latest.avg_temperature !== null ? latest.avg_temperature.toFixed(1) : "--";
                        document.getElementById("avg-humidity").innerText = latest.avg_humidity !== null ? latest.avg_humidity.toFixed(1) : "--";
                        document.getElementById("avg-pressure").innerText = Math.floor(Math.random() * 100 + 50); // Simulated
                        document.getElementById("last-update").innerText = new Date().toLocaleTimeString();
                    }
                    
                    weatherChart.update();
                })
                .catch(error => {
                    console.error('Error fetching historical data:', error);
                    document.getElementById("db-status").textContent = "Error connecting to database";
                    document.getElementById("db-status").style.color = "#f94144";
                    document.getElementById("db-pulse").classList.add("error");
                });
        }

        // Connect to the MQTT Broker over WebSockets
        const mqttClient = mqtt.connect('ws://157.173.101.159:9001');

        mqttClient.on('connect', () => {
            console.log("Connected to MQTT via WebSockets");
            document.getElementById("mqtt-status").textContent = "Connected";
            document.getElementById("mqtt-status").style.color = "#4cc9f0";
            mqttClient.subscribe("/work_group_01/room_temp/temperature");
            mqttClient.subscribe("/work_group_01/room_temp/humidity");
        });

        mqttClient.on('error', (error) => {
            console.error("MQTT connection error:", error);
            document.getElementById("mqtt-status").textContent = "Connection error";
            document.getElementById("mqtt-status").style.color = "#f94144";
        });

        mqttClient.on('message', (topic, message) => {
            console.log(`Received: ${topic} → ${message.toString()}`);
            const value = parseFloat(message.toString());
            
            // Update the display with animation
            if (topic === "/work_group_01/room_temp/temperature") {
                const tempElement = document.getElementById("temp");
                animateValue(tempElement, parseFloat(tempElement.innerText) || 0, value, 1000);
                
                // Send to backend to store in SQLite
                axios.post('/api/weather/data', {
                    type: 'temperature',
                    value: value,
                    timestamp: new Date().toISOString()
                }).catch(error => console.error('Error storing temperature:', error));
                
            } else if (topic === "/work_group_01/room_temp/humidity") {
                const humidityElement = document.getElementById("humidity");
                animateValue(humidityElement, parseFloat(humidityElement.innerText) || 0, value, 1000);
                
                // Send to backend to store in SQLite
                axios.post('/api/weather/data', {
                    type: 'humidity',
                    value: value,
                    timestamp: new Date().toISOString()
                }).catch(error => console.error('Error storing humidity:', error));
            }
        });

        // Animate value change function
        function animateValue(element, start, end, duration) {
            if (isNaN(start)) start = 0;
            if (isNaN(end)) return;
            
            const range = end - start;
            let current = start;
            const increment = end > start ? 0.1 : -0.1;
            const stepTime = Math.abs(Math.floor(duration / (range / increment)));
            
            const timer = setInterval(function() {
                current += increment;
                element.innerText = current.toFixed(1);
                
                if ((increment > 0 && current >= end) || (increment < 0 && current <= end)) {
                    element.innerText = end.toFixed(1);
                    clearInterval(timer);
                }
            }, stepTime);
        }

        // Fetch current readings on load
        fetchCurrentReadings();

        // Update chart with historical data regularly
        updateChartWithHistoricalData(); // Initial load
        setInterval(updateChartWithHistoricalData, 30000); // Then every 30 seconds
        
        // Simulate air quality data updates
        setInterval(() => {
            const pressureElement = document.getElementById("pressure");
            const currentValue = parseInt(pressureElement.innerText) || 75;
            const newValue = currentValue + (Math.random() > 0.5 ? 1 : -1) * Math.floor(Math.random() * 5);
            animateValue(pressureElement, currentValue, newValue, 1000);
        }, 10000);
    </script>
</body>
</html>
